<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kevin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: single-column phone-style chat, header / scrolling thread / composer. */
:root {
  --bg: #e9eef3;
  --surface: #ffffff;
  --fg: #16212b;
  --muted: #5d6c7a;
  --line: #d3dce5;
  --me: #1f6f78;
  --me-fg: #ffffff;
  --kevin: #ffffff;
  --kevin-fg: #16212b;
  --accent: #f2b632;
  --accent-fg: #2a1f00;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1820; --surface: #17232d; --fg: #e8eef3; --muted: #8fa0af; --line: #263642;
    --me: #2a8b96; --me-fg: #ffffff; --kevin: #1f2f3b; --kevin-fg: #e8eef3;
    --accent: #f2b632; --accent-fg: #2a1f00; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1820; --surface: #17232d; --fg: #e8eef3; --muted: #8fa0af; --line: #263642;
  --me: #2a8b96; --me-fg: #ffffff; --kevin: #1f2f3b; --kevin-fg: #e8eef3;
  --accent: #f2b632; --accent-fg: #2a1f00; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
}
.app {
  height: 100%;
  max-width: 560px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}
header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--accent); color: var(--accent-fg);
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: 20px;
  flex: none;
}
.who { min-width: 0; }
.who h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1.1; }
.who p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.who p::before {
  content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: #3fb27f; margin-right: 6px;
}
#thread {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.msg {
  max-width: 78%;
  padding: 9px 14px;
  border-radius: 18px;
  line-height: 1.35;
  overflow-wrap: anywhere;
  animation: pop 0.14s ease-out;
}
.msg.me { align-self: flex-end; background: var(--me); color: var(--me-fg); border-bottom-right-radius: 5px; }
.msg.kevin { align-self: flex-start; background: var(--kevin); color: var(--kevin-fg); border-bottom-left-radius: 5px; border: 1px solid var(--line); font-weight: 500; }
.typing { display: inline-flex; gap: 4px; align-items: center; padding-block: 14px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: 0.15s; }
.typing i:nth-child(3) { animation-delay: 0.3s; }
@keyframes blink { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }
@keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
form {
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  background: var(--surface);
  border-top: 1px solid var(--line);
}
#box {
  flex: 1;
  min-width: 0;
  font: inherit;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 10px 16px;
}
#box::placeholder { color: var(--muted); }
button {
  font: inherit;
  font-weight: 500;
  border: 0;
  border-radius: 22px;
  padding: 0 20px;
  background: var(--accent);
  color: var(--accent-fg);
  cursor: pointer;
}
button:hover { filter: brightness(0.95); }
#box:focus-visible, button:focus-visible { outline: 2px solid var(--me); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  .msg, .typing i { animation: none; }
}
</style>

<div class="app">
  <header>
    <div class="avatar" aria-hidden="true">K</div>
    <div class="who">
      <h1>Kevin</h1>
      <p>Online</p>
    </div>
  </header>
  <div id="thread" role="log" aria-live="polite" aria-label="Conversation with Kevin">
    <div class="msg me">Kevin, what is the meaning of life?</div>
    <div class="msg kevin">Kevin</div>
  </div>
  <form id="form" autocomplete="off">
    <input id="box" type="text" placeholder="Ask Kevin anything" aria-label="Message to Kevin" enterkeyhint="send">
    <button type="submit" id="send">Send</button>
  </form>
</div>

<script>
(function () {
  var thread = document.getElementById("thread");
  var form = document.getElementById("form");
  var box = document.getElementById("box");

  function scrollDown() { thread.scrollTop = thread.scrollHeight; }

  function add(cls, text) {
    var d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = text;
    thread.appendChild(d);
    scrollDown();
    return d;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = box.value.trim();
    if (!text) return;
    add("me", text);
    box.value = "";
    box.focus();

    var t = document.createElement("div");
    t.className = "msg kevin typing";
    t.innerHTML = "<i></i><i></i><i></i>";
    thread.appendChild(t);
    scrollDown();

    setTimeout(function () {
      t.className = "msg kevin";
      t.textContent = "Kevin";
      scrollDown();
    }, 500 + Math.random() * 600);
  });

  scrollDown();
})();
</script>

</body></html>
